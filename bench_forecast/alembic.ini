# =============================================================================
# Alembic configuration — Bench Forecast
#
# Run from bench_forecast/ directory:
#   alembic upgrade head           # apply all pending migrations
#   alembic downgrade -1           # roll back one migration
#   alembic revision --autogenerate -m "describe change"
#   alembic history                # show migration history
# =============================================================================

[alembic]
# Location of the alembic/ directory (relative to this ini file)
script_location = alembic

# Override DSN set dynamically in env.py via Config.get_postgres_dsn()
# Leave as placeholder — env.py injects the real value at runtime
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/bench_forecast

# Auto-generate will detect type changes and server default changes
[alembic:exclude]
tables = spatial_ref_sys

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
